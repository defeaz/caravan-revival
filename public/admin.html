<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Availability | Caravan Revival</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body><header><img src="/assets/caravan-revival-badge.svg" alt="Caravan Revival"><div><p>Private calendar</p><h1>Select available dates</h1></div><button id="sign-out" hidden>Lock calendar</button></header><main><section id="login"><h2>Open your calendar</h2><p>Enter your private calendar password.</p><form id="login-form"><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Open calendar</button><p id="login-status" role="alert"></p></form></section><section id="calendar" hidden><div class="instructions"><p>Tap a date to make it available. Tap it again to remove it.</p><span><i class="available-key"></i> Available</span><span><i class="booked-key"></i> Has bookings</span></div><div class="month-controls"><button id="previous" aria-label="Previous month">←</button><h2 id="month-name"></h2><button id="next" aria-label="Next month">→</button></div><div class="weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="days" class="days"></div><p id="calendar-status" role="status"></p></section></main></body></html>
